services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ew2026_nginx
    ports:
      - "16020:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    networks:
      - ew2026-net

  mongodb:
    image: mongo:7
    container_name: ew2026_mongo
    environment:
      - MONGO_INITDB_DATABASE=ew2026
    volumes:
      - mongo_data:/data/db
      - ./data/povoamento/fixtures.json:/docker-entrypoint-initdb.d/fixtures.json:ro
      - ./data/povoamento/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - ew2026-net

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: ew2026_api
    volumes:
      - ./data/aip:/aip
    environment:
      - PORT=16025
      - MONGO_URL=mongodb://mongodb:27017/ew2026
      - AIP_DIR=/aip
      - AUTH_URL=http://auth:16027
      - AUTH_COOKIE_NAME=ew.auth
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai:8000}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-http://localhost:16020}
      - API_RATE_LIMIT_WINDOW_MS=${API_RATE_LIMIT_WINDOW_MS:-900000}
      - API_RATE_LIMIT_MAX_REQUESTS=${API_RATE_LIMIT_MAX_REQUESTS:-300}
    depends_on:
      - mongodb
    networks:
      - ew2026-net

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: ew2026_auth
    environment:
      - PORT=16027
      - MONGO_URL=mongodb://mongodb:27017/ew2026
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - API_URL=http://api:16025
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    depends_on:
      - mongodb
    networks:
      - ew2026-net

  interface:
    build:
      context: ./services/interface
      dockerfile: Dockerfile
    container_name: ew2026_interface
    environment:
      - PORT=16026
      - MONGO_URL=mongodb://mongodb:27017/ew2026
      - API_URL=http://api:16025
      - AUTH_URL=http://auth:16027
      - AUTH_REFRESH_COOKIE_NAME=ew2026_refresh
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_COOKIE_NAME=ew.sid
      - SESSION_STORE_COLLECTION=interface_sessions
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-86400}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:16020}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
    depends_on:
      - api
      - auth
    networks:
      - ew2026-net

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: ew2026_gateway
    expose:
      - "16020"
    environment:
      - PORT=16020
      - API_URL=http://api:16025
      - AUTH_URL=http://auth:16027
      - INTERFACE_URL=http://interface:16026
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:16020}
      - GATEWAY_RATE_LIMIT_WINDOW_MS=${GATEWAY_RATE_LIMIT_WINDOW_MS:-900000}
      - GATEWAY_RATE_LIMIT_MAX_REQUESTS=${GATEWAY_RATE_LIMIT_MAX_REQUESTS:-500}
    depends_on:
      - api
      - auth
      - interface
    networks:
      - ew2026-net

  ollama:
    image: ollama/ollama:latest
    container_name: ew2026_ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0:11434
    expose:
      - "11434"
    networks:
      - ew2026-net
    restart: unless-stopped

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: ew2026_ai
    expose:
      - "8000"
    volumes:
      - ai_data:/app/data
    environment:
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-llama3.2:1b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - FAISS_INDEX_PATH=/app/data/faiss_index
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - OLLAMA_CONNECT_TIMEOUT_SECONDS=${OLLAMA_CONNECT_TIMEOUT_SECONDS:-2}
      - OLLAMA_READ_TIMEOUT_SECONDS=${OLLAMA_READ_TIMEOUT_SECONDS:-5}
      - OLLAMA_MAX_ATTEMPTS=${OLLAMA_MAX_ATTEMPTS:-2}
      - OLLAMA_RETRY_BACKOFF_SECONDS=${OLLAMA_RETRY_BACKOFF_SECONDS:-0.25}
      - OLLAMA_EMBEDDING_TIMEOUT_SECONDS=${OLLAMA_EMBEDDING_TIMEOUT_SECONDS:-120}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
    depends_on:
      - ollama
    networks:
      - ew2026-net
    restart: unless-stopped

networks:
  ew2026-net:
    driver: bridge

volumes:
  mongo_data:
  ollama_models:
  ai_data:
