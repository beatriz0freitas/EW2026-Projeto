# Inventário Ansible para provisionamento da Plataforma EW2026

[dev_vm]
ew2026_vm ansible_host=192.168.56.10 ansible_user=vagrant

[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[all:vars]
project_root=/vagrant/plataforma-recursos
ollama_model_llm=llama3.2:1b
ollama_model_embedding=nomic-embed-text
